name: Firmware

# The NCS workspace fetch is heavy (~10 GB, 15+ minutes), so this workflow only
# runs when the firmware or this file changes, or on manual dispatch.
on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  build:
    name: Zephyr build (xiao_nrf54l15, NCS v3.3.0)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.3.0
    defaults:
      run:
        # Toolchain environment variables are only set in bash sessions.
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: openfloat

      - name: Initialize NCS v3.3.0 workspace
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.3.0 ncs
          cd ncs
          west update -o=--depth=1 -n

      # Build the freestanding app out-of-tree from inside the west workspace.
      # NCS v3.3.0 ships the xiao_nrf54l15 board, so no BOARD_ROOT is needed
      # (passing one fails the build; see firmware/BUILDING.md).
      - name: Build firmware
        working-directory: ncs
        run: |
          west build -p always -b xiao_nrf54l15/nrf54l15/cpuapp \
            -d "$GITHUB_WORKSPACE/openfloat/firmware/build-ci" \
            "$GITHUB_WORKSPACE/openfloat/firmware"

      - name: Upload merged.hex
        uses: actions/upload-artifact@v7
        with:
          name: openfloat-merged-hex
          path: openfloat/firmware/build-ci/merged.hex
          if-no-files-found: error
